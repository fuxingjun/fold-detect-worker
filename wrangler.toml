name = "fold-detect-worker"
main = "src/worker.js"
compatibility_date = "2026-04-07"

# 静态资源: / 由 public/index.html 直接服务, 未命中资源的请求回落到 Worker
[assets]
directory = "./public"

[triggers]
crons = ["0 */6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "fold-detect-db"

[vars]
DATASET_URL = "https://raw.githubusercontent.com/KHwang9883/MobileModels-csv/main/models.csv"

# 敏感凭据不要写在 [vars]（会随仓库明文提交，Dashboard/日志中可见）：
# - 生产环境: npx wrangler secret put SYNC_TOKEN / WECOM_WEBHOOK（或 Dashboard 配置为 Secret）
# - 本地开发: 写入 .dev.vars 文件（已加入 .gitignore，wrangler dev 自动读取）

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

