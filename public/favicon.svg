<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- favicon: 横向折叠屏 (书页式展开) 图标, 配色与站点深色主题一致 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a5e"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c8cff"/>
      <stop offset="1" stop-color="#38e1c2"/>
    </linearGradient>
  </defs>
  <!-- 圆角底板 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 展开的左右内屏 -->
  <rect x="10" y="17" width="20" height="30" rx="3" fill="none" stroke="url(#panel)" stroke-width="3"/>
  <rect x="34" y="17" width="20" height="30" rx="3" fill="none" stroke="url(#panel)" stroke-width="3"/>
  <!-- 中间铰链折痕 (虚线) -->
  <line x1="32" y1="15" x2="32" y2="49" stroke="#6c8cff" stroke-width="2" stroke-dasharray="2.5 4" stroke-linecap="round" opacity="0.9"/>
  <!-- 左右外屏轮廓提示 -->
  <line x1="13" y1="12" x2="25" y2="12" stroke="#38e1c2" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <line x1="39" y1="12" x2="51" y2="12" stroke="#38e1c2" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
</svg>
